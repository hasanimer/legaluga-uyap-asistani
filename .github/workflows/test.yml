name: test
# Actions bütçesi sınırlı: yalnız kod ya da test değişince, bağımlılıksız tek iş.
on:
  push:
    branches: [main]
    paths: ["extension/**", "tests/**", "scripts/**", ".github/workflows/**"]
  pull_request:
    paths: ["extension/**", "tests/**", "scripts/**", ".github/workflows/**"]
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: for f in extension/*.js; do node --check "$f"; done
      - run: node --test "tests/*.test.mjs"
      - run: python3 scripts/paketle.py
